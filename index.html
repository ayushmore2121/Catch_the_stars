<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Catch the Falling Stars</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }
    body {
      background: #090a10;
      color: #fff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
    }
    #game-container {
      position: relative;
      box-shadow: 0 0 30px rgba(0, 255, 204, 0.2);
      border-radius: 12px;
      overflow: hidden;
      border: 2px solid #00ffcc44;
    }
    canvas {
      display: block;
      background: radial-gradient(circle at center, #141829 0%, #080a12 100%);
      cursor: pointer;
    }
    .ui-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 15px;
    }
    .hud {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-weight: bold;
      font-size: 18px;
      text-shadow: 0 0 8px rgba(255,255,255,0.5);
    }
    .powerup-bar {
      display: flex;
      gap: 10px;
      margin-top: 5px;
    }
    .badge {
      background: rgba(255,255,255,0.1);
      padding: 4px 8px;
      border-radius: 12px;
      font-size: 12px;
      border: 1px solid rgba(255,255,255,0.2);
    }
    .modal {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(8, 10, 18, 0.85);
      backdrop-filter: blur(4px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      pointer-events: auto;
      text-align: center;
      padding: 20px;
    }
    h1 {
      font-size: 32px;
      color: #00ffcc;
      text-shadow: 0 0 15px #00ffcc;
      margin-bottom: 10px;
    }
    p {
      color: #aaa;
      margin-bottom: 20px;
      font-size: 14px;
      line-height: 1.5;
    }
    button {
      background: linear-gradient(135deg, #00ffcc, #0099ff);
      border: none;
      color: #000;
      padding: 12px 28px;
      font-weight: bold;
      font-size: 16px;
      border-radius: 25px;
      cursor: pointer;
      box-shadow: 0 0 15px rgba(0, 255, 204, 0.4);
      transition: transform 0.1s, box-shadow 0.1s;
    }
    button:hover {
      transform: scale(1.05);
      box-shadow: 0 0 25px rgba(0, 255, 204, 0.7);
    }
    .hidden {
      display: none !important;
    }
  </style>
</head>
<body>

  <div id="game-container">
    <canvas id="gameCanvas" width="400" height="600"></canvas>
    
    <div class="ui-overlay">
      <div class="hud">
        <div id="scoreDisplay">Score: 0</div>
        <div id="shieldDisplay">Shield: ❤️❤️❤️</div>
      </div>
      <div class="powerup-bar" id="powerupBar"></div>
    </div>

    <!-- Start Screen -->
    <div id="startModal" class="modal">
      <h1>CATCH THE STARS</h1>
      <p>Move your basket using <b>Mouse</b>, <b>Touch</b>, or <b>Arrow Keys / A & D</b>.<br/><br/>
      ⭐ Catch Golden & Blue Stars<br/>
      ⚡ Collect Power-ups<br/>
      💣 Avoid Red Asteroids</p>
      <button id="startBtn">START GAME</button>
    </div>

    <!-- Game Over Screen -->
    <div id="gameOverModal" class="modal hidden">
      <h1 style="color: #ff4466; text-shadow: 0 0 15px #ff4466;">GAME OVER</h1>
      <p id="finalScoreText">Score: 0</p>
      <p id="highScoreText">High Score: 0</p>
      <button id="restartBtn">PLAY AGAIN</button>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    // Web Audio Synthesizer
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function playSound(type) {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain);
      gain.connect(audioCtx.destination);

      const now = audioCtx.currentTime;
      if (type === 'catch') {
        osc.frequency.setValueAtTime(440, now);
        osc.frequency.exponentialRampToValueAtTime(880, now + 0.1);
        gain.gain.setValueAtTime(0.15, now);
        gain.gain.linearRampToValueAtTime(0.01, now + 0.1);
        osc.start(now);
        osc.stop(now + 0.1);
      } else if (type === 'powerup') {
        osc.frequency.setValueAtTime(300, now);
        osc.frequency.exponentialRampToValueAtTime(600, now + 0.2);
        gain.gain.setValueAtTime(0.2, now);
        gain.gain.linearRampToValueAtTime(0.01, now + 0.2);
        osc.start(now);
        osc.stop(now + 0.2);
      } else if (type === 'hit') {
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(150, now);
        osc.frequency.exponentialRampToValueAtTime(40, now + 0.2);
        gain.gain.setValueAtTime(0.2, now);
        gain.gain.linearRampToValueAtTime(0.01, now + 0.2);
        osc.start(now);
        osc.stop(now + 0.2);
      }
    }

    // Game State Variable
    let score = 0;
    let shields = 3;
    let combo = 0;
    let gameActive = false;
    let frameCount = 0;
    let highScore = localStorage.getItem('catch_stars_highscore') || 0;

    // Player Object
    const player = {
      x: canvas.width / 2 - 40,
      y: canvas.height - 35,
      width: 80,
      baseWidth: 80,
      height: 12,
      speed: 8,
      dx: 0,
      color: '#00ffcc'
    };

    // Power-up Timers
    const powerups = {
      wide: 0,
      magnet: 0,
      slow: 0
    };

    // Game Entities
    let items = [];
    let particles = [];
    let floatingTexts = [];

    // Keys State
    const keys = {};

    // Controls
    document.addEventListener('keydown', (e) => keys[e.key] = true);
    document.addEventListener('keyup', (e) => keys[e.key] = false);

    canvas.addEventListener('mousemove', (e) => {
      const rect = canvas.getBoundingClientRect();
      const mouseX = e.clientX - rect.left;
      player.x = mouseX - player.width / 2;
    });

    canvas.addEventListener('touchmove', (e) => {
      if (e.touches.length > 0) {
        const rect = canvas.getBoundingClientRect();
        const touchX = e.touches[0].clientX - rect.left;
        player.x = touchX - player.width / 2;
      }
    });

    // Item Spawner
    function spawnItem() {
      const rand = Math.random();
      let type = 'star';
      let color = '#ffcc00';
      let radius = 10;
      let speed = 2.5 + Math.random() * 1.5;

      if (rand < 0.5) {
        type = 'star'; // Regular
      } else if (rand < 0.7) {
        type = 'blueStar'; // Faster, high score
        color = '#00aaff';
        speed += 1.5;
      } else if (rand < 0.85) {
        type = 'asteroid'; // Obstacle
        color = '#ff3366';
        radius = 12;
      } else {
        type = 'powerup';
        const pTypes = ['wide', 'magnet', 'slow'];
        type = pTypes[Math.floor(Math.random() * pTypes.length)];
        color = type === 'wide' ? '#cc00ff' : type === 'magnet' ? '#00ffaa' : '#ffff00';
        radius = 11;
      }

      items.push({
        x: Math.random() * (canvas.width - 30) + 15,
        y: -15,
        radius,
        speed,
        type,
        color,
        rotation: 0
      });
    }

    // Spawn Particles
    function createExplosion(x, y, color, count = 12) {
      for (let i = 0; i < count; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = Math.random() * 4 + 1;
        particles.push({
          x, y,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed,
          life: 1,
          decay: 0.03 + Math.random() * 0.02,
          color
        });
      }
    }

    function addFloatingText(text, x, y, color) {
      floatingTexts.push({ text, x, y, alpha: 1, color });
    }

    // Update Game Loop
    function update() {
      if (!gameActive) return;

      frameCount++;
      if (frameCount % Math.max(20, 60 - Math.floor(score / 500) * 5) === 0) {
        spawnItem();
      }

      // Keyboard movement
      if (keys['ArrowLeft'] || keys['a']) player.x -= player.speed;
      if (keys['ArrowRight'] || keys['d']) player.x += player.speed;

      // Handle paddle width with Powerup
      player.width = powerups.wide > 0 ? player.baseWidth * 1.4 : player.baseWidth;

      // Restrict boundaries
      if (player.x < 0) player.x = 0;
      if (player.x + player.width > canvas.width) player.x = canvas.width - player.width;

      // Power-up durations decrement
      for (let key in powerups) {
        if (powerups[key] > 0) powerups[key]--;
      }

      // Process items
      for (let i = items.length - 1; i >= 0; i--) {
        const item = items[i];
        let currentSpeed = powerups.slow > 0 ? item.speed * 0.5 : item.speed;

        // Magnet Power-up behavior
        if (powerups.magnet > 0 && item.type !== 'asteroid') {
          const dx = (player.x + player.width / 2) - item.x;
          item.x += dx * 0.05;
        }

        item.y += currentSpeed;
        item.rotation += 0.05;

        // Collision Check
        if (
          item.y + item.radius >= player.y &&
          item.y - item.radius <= player.y + player.height &&
          item.x >= player.x - 5 &&
          item.x <= player.x + player.width + 5
        ) {
          if (item.type === 'asteroid') {
            shields--;
            combo = 0;
            playSound('hit');
            createExplosion(item.x, item.y, '#ff3366', 20);
            if (shields <= 0) endGame();
          } else if (item.type === 'star' || item.type === 'blueStar') {
            combo++;
            const pts = (item.type === 'blueStar' ? 250 : 100) * (1 + Math.floor(combo / 5) * 0.5);
            score += pts;
            playSound('catch');
            createExplosion(item.x, item.y, item.color, 12);
            addFloatingText(`+${pts}`, item.x, item.y, item.color);
          } else {
            // Power-up caught
            powerups[item.type] = 350; // frames active duration
            playSound('powerup');
            createExplosion(item.x, item.y, item.color, 15);
            addFloatingText(`${item.type.toUpperCase()}!`, item.x, item.y, item.color);
          }
          items.splice(i, 1);
          continue;
        }

        // Offscreen Miss
        if (item.y - item.radius > canvas.height) {
          if (item.type === 'star' || item.type === 'blueStar') {
            combo = 0;
          }
          items.splice(i, 1);
        }
      }

      // Process Particles
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.life -= p.decay;
        if (p.life <= 0) particles.splice(i, 1);
      }

      // Process Floating Text
      for (let i = floatingTexts.length - 1; i >= 0; i--) {
        const t = floatingTexts[i];
        t.y -= 1;
        t.alpha -= 0.02;
        if (t.alpha <= 0) floatingTexts.splice(i, 1);
      }

      updateUI();
    }

    // Render Canvas Elements
    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // Draw Player Paddle
      ctx.fillStyle = player.color;
      ctx.shadowBlur = 15;
      ctx.shadowColor = player.color;
      ctx.beginPath();
      ctx.roundRect(player.x, player.y, player.width, player.height, 6);
      ctx.fill();

      // Draw Catchable Items
      items.forEach((item) => {
        ctx.fillStyle = item.color;
        ctx.shadowBlur = 10;
        ctx.shadowColor = item.color;

        ctx.save();
        ctx.translate(item.x, item.y);
        ctx.rotate(item.rotation);

        if (item.type === 'star' || item.type === 'blueStar') {
          // Draw Star Shape
          ctx.beginPath();
          for (let i = 0; i < 5; i++) {
            ctx.lineTo(Math.cos((18 + i * 72) * Math.PI / 180) * item.radius,
                       -Math.sin((18 + i * 72) * Math.PI / 180) * item.radius);
            ctx.lineTo(Math.cos((54 + i * 72) * Math.PI / 180) * (item.radius/2),
                       -Math.sin((54 + i * 72) * Math.PI / 180) * (item.radius/2));
          }
          ctx.closePath();
          ctx.fill();
        } else {
          // Draw Circle for Powerups / Asteroids
          ctx.beginPath();
          ctx.arc(0, 0, item.radius, 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.restore();
      });

      // Draw Particles
      particles.forEach((p) => {
        ctx.fillStyle = p.color;
        ctx.globalAlpha = p.life;
        ctx.shadowBlur = 5;
        ctx.shadowColor = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, 2.5, 0, Math.PI * 2);
        ctx.fill();
        ctx.globalAlpha = 1.0;
      });

      // Draw Floating Scores
      floatingTexts.forEach((t) => {
        ctx.fillStyle = t.color;
        ctx.globalAlpha = t.alpha;
        ctx.font = 'bold 14px sans-serif';
        ctx.fillText(t.text, t.x, t.y);
        ctx.globalAlpha = 1.0;
      });

      ctx.shadowBlur = 0; // Reset canvas effects
    }

    function updateUI() {
      document.getElementById('scoreDisplay').innerText = `Score: ${score}`;
      document.getElementById('shieldDisplay').innerText = `Shield: ` + '❤️'.repeat(Math.max(0, shields));

      const pBar = document.getElementById('powerupBar');
      pBar.innerHTML = '';
      if (powerups.wide > 0) pBar.innerHTML += `<span class="badge" style="color:#cc00ff">WIDE</span>`;
      if (powerups.magnet > 0) pBar.innerHTML += `<span class="badge" style="color:#00ffaa">MAGNET</span>`;
      if (powerups.slow > 0) pBar.innerHTML += `<span class="badge" style="color:#ffff00">SLOW</span>`;
    }

    function startGame() {
      score = 0;
      shields = 3;
      combo = 0;
      items = [];
      particles = [];
      floatingTexts = [];
      gameActive = true;
      document.getElementById('startModal').classList.add('hidden');
      document.getElementById('gameOverModal').classList.add('hidden');
    }

    function endGame() {
      gameActive = false;
      if (score > highScore) {
        highScore = score;
        localStorage.setItem('catch_stars_highscore', highScore);
      }
      document.getElementById('finalScoreText').innerText = `Final Score: ${score}`;
      document.getElementById('highScoreText').innerText = `High Score: ${highScore}`;
      document.getElementById('gameOverModal').classList.remove('hidden');
    }

    // Main Game Loop
    function loop() {
      update();
      draw();
      requestAnimationFrame(loop);
    }

    document.getElementById('startBtn').addEventListener('click', startGame);
    document.getElementById('restartBtn').addEventListener('click', startGame);

    // Initial Engine Start
    loop();
  </script>
</body>
</html>
